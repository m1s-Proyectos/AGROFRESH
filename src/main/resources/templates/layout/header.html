<header class="topbar" th:fragment="header">
    <a class="brand" th:href="@{/}" aria-label="AGROFRESH, inicio">
        <span class="brand-mark" aria-hidden="true">A</span><span class="brand-name">AGRO<span>FRESH</span></span>
    </a>
    <div class="topbar-right" th:if="${sesion != null}">
        <span class="topbar-date" th:text="${sesion.fecha}">10/11/2026</span>
        <details class="account-menu agro-account">
            <summary aria-label="Abrir menú de usuario" title="Mi cuenta">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg>
            </summary>
            <div class="agro-account-card account-dropdown">
                <div class="agro-account-heading">
                    <div class="agro-account-emblem" aria-hidden="true">
                        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg>
                    </div>
                    <div class="agro-account-identity">
                        <strong th:text="${sesion.nombre}">Usuario AgroFresh</strong>
                        <span th:text="${'@' + sesion.username}">@usuario</span>
                    </div>
                </div>
                <div class="agro-account-badge" th:text="${sesion.rol}">ADMINISTRADOR</div>
                <div class="agro-account-divider"></div>
                <a class="agro-account-link" th:href="@{/perfil}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg>
                    <span>Mi perfil</span>
                    <svg class="agro-account-chevron" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                </a>
                <form class="agro-account-logout" th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="agro-account-link agro-account-exit">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>
                        <span>Cerrar sesión</span>
                    </button>
                </form>
            </div>
        </details>
    </div>

    <style>
      /* AgroFresh: estilos del menú de cuenta aislados y cargados con el fragmento */
      header.topbar { position:relative; z-index:2000; overflow:visible; }
      header.topbar .topbar-right { position:relative; display:flex; gap:18px; align-items:center; z-index:2001; }
      header.topbar .agro-account {position:relative; z-index:2002; min-width:0; margin:0; }
      header.topbar .agro-account > summary {display:grid;place-items:center; width:42px;height:42px;padding:0; border:1px solid #799983; border-radius:50%; background:transparent; color:#fff; cursor:pointer; list-style:none; }
      header.topbar .agro-account > summary::-webkit-details-marker {display:none;}
      header.topbar .agro-account > summary:hover, header.topbar .agro-account[open] > summary {background:#2e5941;}
      header.topbar .agro-account .agro-account-card {position:absolute;top:calc(100% + 12px);right:0;left:auto;z-index:3000;display:block;width:292px;min-width:292px;max-width:calc(100vw - 22px);padding:17px;background:#fffefa;color:#203e2a;border:1px solid #dce8d9;border-radius:14px;box-shadow:0 18px 48px rgba(8,30,17,.28);white-space:normal;line-height:1.4;pointer-events:auto;}
      header.topbar .agro-account .agro-account-heading {display:flex;align-items:center;gap:12px;}
      header.topbar .agro-account .agro-account-emblem {flex:0 0 44px;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:#e8f1e3;color:#35654a;}
      header.topbar .agro-account .agro-account-identity {display:flex;flex-direction:column;gap:3px;min-width:0;}
      header.topbar .agro-account .agro-account-identity strong {display:block;font-size:13px;color:#1c3525;overflow-wrap:anywhere;}
      header.topbar .agro-account .agro-account-identity span {font-size:11px;color:#738276;overflow-wrap:anywhere;}
      header.topbar .agro-account .agro-account-badge {display:inline-block;margin:13px 0 2px 56px;padding:5px 9px;border-radius:16px;background:#eff5e9;color:#49754d;font-size:10px;font-weight:700;letter-spacing:.04em;}
      header.topbar .agro-account .agro-account-divider {height:1px;background:#e4eae0;margin:12px 0 8px;}
      header.topbar .agro-account .agro-account-link {display:flex;align-items:center;gap:11px;width:100%;margin:0;padding:12px 10px;border:none;border-radius:9px;background:transparent;color:#2b4733;text-align:left;text-decoration:none;font:600 13px 'Trebuchet MS',Arial,sans-serif;cursor:pointer;}
      header.topbar .agro-account .agro-account-link:hover {background:#edf4e9;}
      header.topbar .agro-account .agro-account-chevron {margin-left:auto;}
      header.topbar .agro-account .agro-account-logout {margin:5px 0 0;padding:7px 0 0;border-top:1px solid #e4eae0;}
      header.topbar .agro-account .agro-account-exit {color:#9d443b;}
      header.topbar .agro-account .agro-account-exit:hover {background:#fcf0ec;}
      header.topbar .agro-account .agro-account-link:focus-visible {outline:2px solid #b49b59;outline-offset:2px;}
      @media(max-width:450px) {header.topbar .agro-account .agro-account-card {right:-5px;width:270px;min-width:270px;}}
    </style>
</header>
