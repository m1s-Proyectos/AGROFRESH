<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AGROFRESH</title><link rel="stylesheet" th:href="@{/css/agrofresh.css(v='20261110c')}"></head><body><div class="app-shell"><div th:replace="~{layout/header :: header}"></div><div class="workspace"><div th:replace="~{layout/sidebar :: sidebar('dashboard')}"></div><main class="main-content"><div class="eyebrow"><span class="eyebrow-line"></span> AGROFRESH</div><section class="simple-panel"><p class="section-kicker">MI CUENTA</p><h1>Mi perfil</h1><p>Información del usuario autenticado.</p><dl class="profile-data"><dt>Nombre</dt><dd th:text="${perfil.nombre + ' ' + perfil.apellido}"></dd><dt>Usuario</dt><dd th:text="${perfil.username}"></dd><dt>Correo</dt><dd th:text="${perfil.correo}"></dd><dt>Rol</dt><dd th:text="${perfil.rol}"></dd></dl><a class="back-link" th:href="@{/}">Volver al Dashboard</a></section><div th:replace="~{layout/footer :: footer}"></div></main></div></div></body></html>
