<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | AGROFRESH</title>
  <link rel="stylesheet" th:href="@{/css/agrofresh.css(v='20261110c')}">
  <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-logo"><span class="brand-mark">A</span><span class="brand-name">AGRO<span>FRESH</span></span></div>
    <p class="login-eyebrow">SISTEMA DE INVENTARIO</p>
    <h1>Bienvenido <em>de nuevo.</em></h1>
    <p class="login-description">Ingresa tus credenciales para acceder al sistema.</p>
    <div class="login-alert" th:if="${param.error}" role="alert">Usuario o contraseña incorrectos, o cuenta deshabilitada.</div>
    <div class="login-success" th:if="${param.logout}" role="status">Has cerrado sesión correctamente.</div>
    <form th:action="@{/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <label for="username">Nombre de usuario</label>
      <input id="username" name="username" type="text" autocomplete="username" maxlength="50" required autofocus placeholder="Tu usuario">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Tu contraseña">
      <button type="submit">Iniciar sesión <span aria-hidden="true">↗</span></button>
    </form>
    <p class="login-footer">Acceso exclusivo al personal autorizado.</p>
  </main>
</body>
</html>
